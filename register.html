
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Distributed Log Analytics</title>
    <link rel="stylesheet" href="log-analytics.css">

    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
        }

        .container {
            width: min(440px, 92%);
            margin: 30px auto;
        }

        .register-card {
            padding: 28px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .12);
        }

        label {
            display: block;
            margin: 16px 0 6px;
        }

        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
        }

        button {
            cursor: pointer;
        }

        button:disabled {
            cursor: wait;
            opacity: .6;
        }

        #registerMessage {
            overflow-wrap: anywhere;
        }

        .login-link {
            text-align: center;
            margin-top: 18px;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Distributed Log Analytics System</h1>
        <p>Microservices Monitoring &amp; Log Analytics</p>

        <section class="register-card">
            <h2>Create Account</h2>

            <form id="registerForm">
                <label for="username">Username</label>
                <input
                    id="username"
                    name="username"
                    maxlength="50"
                    autocomplete="username"
                    required
                >

                <label for="email">Email</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    maxlength="100"
                    autocomplete="email"
                    required
                >

                <label for="password">Password</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <button id="registerButton" type="submit">
                    Register
                </button>
            </form>

            <p id="registerMessage" role="status" aria-live="polite"></p>

            <p class="login-link">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>
        </section>
    </main>

    <script>
        const form = document.getElementById("registerForm");
        const message = document.getElementById("registerMessage");
        const button = document.getElementById("registerButton");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();
            const email =
                document.getElementById("email").value.trim();
            const password =
                document.getElementById("password").value;

            if (!username || !email || !password) {
                message.textContent = "Please fill in every field.";
                return;
            }

            button.disabled = true;
            message.textContent = "Creating your account...";

            try {
                const response = await fetch(
                    "http://localhost:8082/auth/register",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            username,
                            email,
                            password
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    message.textContent =
                        data.message || "Registration failed.";
                    return;
                }

                message.textContent =
                    "Registration successful! Redirecting to login...";

                form.reset();

                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1200);

            } catch (error) {
                console.error("Registration error:", error);
                message.textContent =
                    "Cannot connect to User Service. " +
                    "Make sure it is running on port 8082.";
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
